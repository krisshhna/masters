<form [formGroup]="loginForm">
    <div>
        <label>Username</label>
        <input type="text" formControlName="username">
    </div>

    <div>
        <label>Password</label>
        <input type="password" formControlName="password">
    </div>

    <div>
        <input type="checkbox" formControlName="recheck"> Sure you want to login ?
    </div>

    <div>
        <button pButton pRipple severity="success" [disabled]="!loginForm.valid" type="submit" class="p-button font-bold" (click)="onSubmit()" >Submit</button>
    </div>

    <div>
        <h1 class="text-3xl">Hello world!</h1>
    </div>

    <div class="p-6 bg-blue-50 rounded-xl">
  <h2 class="text-2xl font-bold text-blue-700 mb-4">Hello Tailwind + PrimeNG!</h2>
  <p-button label="PrimeNG Button"></p-button>
</div>

</form>
